<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Lyrata Joias</title>
</head>
<body>
    <header>
        <h1 class="logo">Lyrata Joias</h1>

        <!-- Menu -->
        <button class="menu-btn" onClick="abrirMenu()"  aria-label="Abrir menu"><i class="bi bi-list"></i></button>

        <nav id="menu">
            <a href="#produtos" data-categoria="todos">Inicio</a>
            <a href="#produtos" data-categoria="brincos">Brincos</a>
            <a href="#produtos" data-categoria="colares">Colares</a>
            <a href="#produtos" data-categoria="pulseiras">Pulseiras</a>
            <a href="#produtos" data-categoria="conjuntos">Conjuntos</a>
            <a href="como-fiz.html">Como fiz</a>
        </nav>
    </header>

    <main>
        <div class="banner">
            <img src="img/banner3.jpg" fetchpriority="high" alt="Banner de inicio da página mostrando a mão de uma mulher com anéis">
        </div>

        <div class="informations">
            <ul>
                <li><i class="bi bi-truck"></i><p>Frete grátis acima de R$200</p></li>
                <li><i class="bi bi-shield-check"></i><p>Garantia de 6 meses em todas as joias</p></li>
                <li><i class="bi bi-gift"></i><p>Embalagem especial para presentear</p></li>
                <li><i class="bi bi-credit-card-2-front"></i><p>Parcele em até 5x sem juros</p></li>
            </ul>
        </div>

        <!-- Busca -->
            <div id="busca">
                <input type="text" id="inputBusca" placeholder="Pesquisar">
                <button class="btn-buscar" onclick="buscarProduto()"  aria-label="Fazer pesquisa">Buscar</button>
                <button class="btn-limpar" onclick="limparBusca()"  aria-label="Limpar pesquisa">Limpar</button>
            </div> 

        <div class="produtos-container" id="produtos"></div>
    </main>

    <footer>Lyrata Joias - 2026</footer>

    <script  type="text/javascript"  src="script.js"> </script>
</body>
</html>
